# Fotoğraf hattı işleri. pipeline/jobs/ altına bir iş dosyası eklenince çalışır,
# sonuçları (aday listesi + inceleme panoları) aynı dala geri yazar.
name: photo-pipeline
on:
  push:
    branches: ["**"]
    paths: ["pipeline/jobs/**"]
  workflow_dispatch:
    inputs:
      job:
        description: "pipeline/jobs altındaki dosya"
        required: true
permissions:
  contents: write
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix pipeline --no-audit --no-fund
      - name: Run new/changed jobs
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then JOBS="${{ github.event.inputs.job }}";
          else JOBS=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- pipeline/jobs/ | grep '\.json$' || true); fi
          for j in $JOBS; do echo "== $j"; node pipeline/harvest.mjs "$j"; done
      - name: Commit results
        run: |
          git config user.name "mazi-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p pipeline/data pipeline/review && touch pipeline/review/.keep
          git add pipeline/data pipeline/review
          git diff --cached --quiet && exit 0
          git commit -m "pipeline: aday listesi ve inceleme panoları"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
