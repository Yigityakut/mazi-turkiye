<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mazi Türkiye · Open Graph 1200×630</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1200px; height: 630px; }
  #root { position: relative; width: 1200px; height: 630px; background: var(--paper); }
  .brand { left: 68px; top: 58px; display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 2px 6px rgba(60,35,15,.18); }
  .brand b { font: 700 30px/1 "Fraunces", serif; letter-spacing: -.3px; }
  h1 { left: 66px; top: 152px; width: 560px; font: 900 84px/.98 "Fraunces", serif; letter-spacing: -2px; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { left: 68px; top: 430px; width: 520px; font: 400 25px/1.42 "Inter", sans-serif; color: var(--muted); }
  .sub b { font-weight: 600; color: var(--ink); }
  .foot { left: 68px; top: 534px; display: flex; align-items: center; gap: 16px; }
  .chip { font: 600 18px/1 "Inter", sans-serif; padding: 11px 16px; border-radius: 999px; background: var(--alt); color: var(--muted); }
  .url { font: 700 21px/1 "Inter", sans-serif; color: var(--ink); letter-spacing: .2px; }

  .card { left: 646px; top: 56px; width: 492px; height: 518px; background: var(--surface); border: 1.5px solid var(--line);
          border-radius: 30px; box-shadow: 0 24px 50px -18px rgba(70,45,20,.28); }
  .card .top { left: 26px; right: 26px; top: 24px; display: flex; justify-content: space-between; align-items: center; }
  .lbl { font: 600 14px/1 "Inter", sans-serif; letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted); }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 11px; height: 11px; border-radius: 6px; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .mapbox { left: 22px; right: 22px; top: 60px; height: 236px; border-radius: 18px; background: var(--water); overflow: hidden; }
  .mapbox svg { width: 100%; height: 100%; display: block; }
  .yr { left: 26px; top: 318px; }
  .yr .lbl { display: block; }
  .yr .val { display: block; margin-top: 8px; font: 900 66px/1 "Fraunces", serif; letter-spacing: -1.5px; color: var(--accent); }
  .q { right: 26px; top: 318px; text-align: right; }
  .q .val { display: block; margin-top: 12px; font: 700 27px/1.2 "Fraunces", serif; letter-spacing: -.3px; color: var(--ink); }
  .q .sm { display: block; margin-top: 6px; font: 600 16px/1 "Inter", sans-serif; color: var(--muted); }
  .slider { left: 26px; right: 26px; top: 424px; height: 60px; }
  .slider svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<div id="root">
  <div class="brand abs"><img src="../../../store/brand/icon-1024.png" alt=""><b>Mazi Türkiye</b></div>
  <h1 class="abs">Bu fotoğraf <em>nerede?</em><br>Hangi <em>yıl?</em></h1>
  <p class="sub abs">Her gün Türkiye'den <b>5 gerçek fotoğraf.</b><br>Haritaya iğneni bırak, yılı tahmin et.</p>
  <div class="foot abs"><span class="chip">Ücretsiz · Reklamsız</span><span class="url">maziturkiye.com</span></div>

  <div class="card abs">
    <div class="top abs"><span class="lbl">Fotoğraf 3 / 5</span><span class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span></div>
    <div class="mapbox abs"><svg id="map"></svg></div>
    <div class="yr abs"><span class="lbl">Hangi yıl?</span><span class="val">1908</span></div>
    <div class="q abs"><span class="lbl">Nerede?</span><span class="val">Kapadokya</span><span class="sm">Nevşehir</span></div>
    <div class="slider abs"><svg id="slider" viewBox="0 0 440 60"></svg></div>
  </div>
</div>
<script src="map-data.js"></script>
<script src="map.js"></script>
<script>
  // Harita: tüm Türkiye, ortada markanın iğnesi, diğer 4 fotoğraf küçük numaralı noktalar
  const pad = 26, W = TRMap.width, H = TRMap.height;
  const map = document.getElementById("map");
  map.setAttribute("viewBox", `${-pad} ${-pad - 30} ${W + pad * 2} ${H + pad * 2 + 40}`);
  map.setAttribute("preserveAspectRatio", "xMidYMid meet");
  const [nx, ny] = TRMap.xy(38.64, 34.83); // Kapadokya (Göreme civarı)
  const others = [["1", TRMap.city("Edirne")], ["2", TRMap.city("Muğla")], ["4", TRMap.city("Rize")], ["5", TRMap.city("Mardin")]];
  map.innerHTML = TRMap.svg({ land: "#FBF7EF", stroke: "#D6C6AA", strokeWidth: 1.6, coast: "#BDA684", coastWidth: 5 }) +
    others.map(([n, [x, y]]) => `<g transform="translate(${x} ${y})"><circle r="27" fill="#1E1913" stroke="#FBF7EF" stroke-width="5"/><text y="10" text-anchor="middle" font-family="Inter" font-weight="700" font-size="29" fill="#FBF7EF">${n}</text></g>`).join("") +
    `<ellipse cx="${nx}" cy="${ny + 3}" rx="34" ry="10" fill="rgba(30,25,19,.2)"/>` +
    TRMap.pin(nx, ny, 58, "#B8432A", "#FBF7EF", true);

  // Yıl kaydırıcısı: 1880–2026, değer 1908
  const s = document.getElementById("slider"), x0 = 8, x1 = 432, y = 20;
  const X = (yr) => x0 + (yr - 1880) / (2026 - 1880) * (x1 - x0);
  let t = `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#DCCFB8" stroke-width="6" stroke-linecap="round"/>`;
  t += `<line x1="${x0}" y1="${y}" x2="${X(1908)}" y2="${y}" stroke="#B8432A" stroke-width="6" stroke-linecap="round"/>`;
  for (let yr = 1890; yr <= 2020; yr += 10) t += `<line x1="${X(yr)}" y1="${y + 10}" x2="${X(yr)}" y2="${y + (yr % 50 === 0 ? 18 : 14)}" stroke="#C9B596" stroke-width="1.5"/>`;
  [[1880, "start"], [1950, "middle"], [2026, "end"]].forEach(([yr, a]) => t += `<text x="${X(yr)}" y="${y + 37}" text-anchor="${a}" font-family="Inter" font-weight="600" font-size="14" fill="#9C8E79">${yr}</text>`);
  t += `<circle cx="${X(1908)}" cy="${y}" r="13" fill="#FBF7EF" stroke="#B8432A" stroke-width="5"/>`;
  s.innerHTML = t;
</script>
</body>
</html>
