<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mazi Türkiye · Profil görseli 1080×1080</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Instagram/TikTok/X/YouTube daire kırpar: iğne merkezden en çok ~%55 yarıçap uzaklıkta kalır. Geometri: store/brand/icon.svg */
  html, body { width: 1080px; height: 1080px; }
  #root { position: relative; width: 1080px; height: 1080px; }
  svg { position: absolute; inset: 0; width: 1080px; height: 1080px; }
</style>
</head>
<body>
<div id="root" class="grain">
  <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg" cx="50%" cy="38%" r="72%">
        <stop offset="0" stop-color="#C9512F"/>
        <stop offset="1" stop-color="#A63A24"/>
      </radialGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5A1E0E" flood-opacity=".28"/>
      </filter>
    </defs>
    <rect width="1080" height="1080" fill="url(#bg)"/>
    <!-- İnce bir daire: kırpma çizgisinin içinde kalan sakin bir çerçeve -->
    <circle cx="540" cy="540" r="452" fill="none" stroke="#F7EEDD" stroke-opacity=".14" stroke-width="3"/>
    <g transform="translate(540 556) scale(0.86) translate(-512 -494)" filter="url(#soft)">
      <!-- İğne: nerede -->
      <path d="M512 150c-150 0-262 112-262 258 0 190 220 400 246 424a24 24 0 0 0 32 0c26-24 246-234 246-424 0-146-112-258-262-258z" fill="#F7EEDD"/>
      <!-- Saat kadranı: ne zaman -->
      <circle cx="512" cy="410" r="150" fill="#A63A24"/>
      <circle cx="512" cy="410" r="128" fill="none" stroke="#F7EEDD" stroke-width="10" stroke-dasharray="4 63.0" stroke-dashoffset="2" opacity="0.9"/>
      <line x1="512" y1="410" x2="512" y2="318" stroke="#F7EEDD" stroke-width="22" stroke-linecap="round"/>
      <line x1="512" y1="410" x2="574" y2="452" stroke="#F7EEDD" stroke-width="22" stroke-linecap="round"/>
      <circle cx="512" cy="410" r="20" fill="#F7EEDD"/>
    </g>
  </svg>
</div>
</body>
</html>
